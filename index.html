<style>
:root { --neon-cyan: #00ffff; --neon-pink: #ff00ff; --neon-green: #00ff88; --neon-red: #ff2244; --bg-dark: #050508; --bg-card: #0d0d14; --bg-panel: #0a0a10; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg-dark); color:white; font-family:'Rajdhani',sans-serif; min-height:100vh; }
.header { background:var(--bg-panel); border-top:3px solid var(--neon-red); border-bottom:2px solid rgba(255,0,68,0.3); padding:12px 20px; display:flex; align-items:center; justify-content:center; gap: 15px; flex-wrap: wrap; }
.header h1 { font-family:'Orbitron',sans-serif; font-size:clamp(16px,4vw,28px); background:linear-gradient(90deg,#00ffff,#00ff88,#ff00ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:hueRotate 4s linear infinite; letter-spacing:2px; }
.live-match-btn { background: linear-gradient(90deg, #ff0044, #ff00ff); color: white; border: none; padding: 10px 22px; font-size: 15px; font-family: 'Orbitron', sans-serif; font-weight: bold; border-radius: 25px; cursor: pointer; animation: pulse 1.5s infinite; display: flex; align-items: center; gap: 8px; text-decoration: none; box-shadow: 0 0 15px rgba(255,0,68,0.5); }
.live-match-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(255,0,68,0.8); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 34, 68, 0.7); } 70% { box-shadow: 0 0 0 12px rgba(255, 34, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 34, 68, 0); } }
@keyframes hueRotate { 0%{filter:hue-rotate(0deg);} 100%{filter:hue-rotate(360deg);} }
.app-wrapper { display:flex; height:calc(100vh - 58px); }
.sidebar { width:280px; min-width:280px; background:var(--bg-panel); border-right:1px solid rgba(0,255,255,0.12); display:flex; flex-direction:column; overflow:hidden; }
.sidebar-controls { padding:10px; border-bottom:1px solid rgba(0,255,255,0.1); display: flex; flex-direction: column; gap: 8px; }
.search-group { width:100%; padding:9px 13px; font-size:13px; border-radius:8px; background:rgba(0,255,255,0.05); color:white; border:1px solid rgba(0,255,255,0.3); outline:none; font-family:'Rajdhani',sans-serif; }
.search-group:focus { border-color:var(--neon-cyan); }
select.search-group { appearance: none; cursor: pointer; }
select.search-group option { background: #111; color: white; }
.sidebar-list { flex:1; overflow-y:auto; padding:6px; scrollbar-width:thin; scrollbar-color:rgba(0,255,255,0.3) transparent; }
.sidebar-list::-webkit-scrollbar { width:4px; }
.sidebar-list::-webkit-scrollbar-thumb { background:rgba(0,255,255,0.3); border-radius:2px; }
.sidebar-channel { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; cursor:pointer; transition:background 0.2s; margin-bottom:3px; position: relative; }
.sidebar-channel:hover { background:rgba(0,255,255,0.08); }
.sidebar-channel.active { background:rgba(0,255,136,0.1); box-shadow:inset 3px 0 0 var(--neon-green); }
.sidebar-channel img, .sidebar-channel .no-logo { width:42px; height:42px; object-fit:contain; background:#111; border-radius:7px; padding:2px; flex-shrink:0; }
.sidebar-channel .ch-name { font-size:13px; color:#ccc; flex:1; line-height:1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 25px; }
.sidebar-channel.active .ch-name { color:var(--neon-green); font-weight:600; }
.fav-btn { background: none; border: none; cursor: pointer; font-size: 16px; padding: 0 5px; color: white; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); z-index: 2; }
.fav-btn:hover { transform: translateY(-50%) scale(1.3); }
.fav-btn.is-fav { color: var(--neon-pink); }
.main-content { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.player-wrap { position:relative; background:#000; flex-shrink:0; }
video { width:100%; display:block; }
@media(min-width:769px) { video { height:55vh; max-height:55vh; } }
@media(max-width:768px) { video { height:auto; max-height:56vw; min-height:180px; } }
.loading-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:5; flex-direction: column; gap: 10px; }
.loading-overlay.show { display:flex; }
.spinner { width:46px; height:46px; border:3px solid rgba(0,255,255,0.2); border-top-color:var(--neon-cyan); border-radius:50%; animation:spin 0.8s linear infinite; }
.skip-text { font-size: 12px; color: var(--neon-red); }
@keyframes spin { to{transform:rotate(360deg);} }
.now-playing { background:rgba(0,0,0,0.9); padding:7px 14px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(0,255,255,0.08); }
.np-label { font-size:11px; color:var(--neon-cyan); font-family:'Orbitron',sans-serif; letter-spacing:1px; }
.np-name { font-size:14px; color:#fff; font-weight:600; }
.kbd-hint { font-size:11px; color:rgba(255,255,255,0.22); }
.transport { background:var(--bg-panel); padding:10px 16px; display:flex; align-items:center; justify-content:center; gap:12px; border-bottom:1px solid rgba(255,0,68,0.15); flex-shrink:0; }
.t-btn { width:48px; height:48px; border:none; border-radius:50%; background:rgba(255,34,68,0.12); color:white; font-size:18px; cursor:pointer; transition:all 0.2s; border:1px solid rgba(255,34,68,0.35); display:flex; align-items:center; justify-content:center; }
.t-btn:hover { background:var(--neon-red); transform:scale(1.1); box-shadow:0 0 18px rgba(255,34,68,0.5); }
.t-btn.play-btn { width:56px; height:56px; font-size:22px; background:rgba(255,0,255,0.12); border-color:rgba(255,0,255,0.4); }
.t-btn.play-btn:hover { background:var(--neon-pink); box-shadow:0 0 22px rgba(255,0,255,0.5); }
.t-btn.pip-btn { background:rgba(0,255,255,0.12); border-color:rgba(0,255,255,0.35); font-size: 20px;}
.t-btn.pip-btn:hover { background:var(--neon-cyan); color: black; box-shadow:0 0 18px rgba(0,255,255,0.5);}
.mobile-section { display:flex; flex:1; flex-direction:column; overflow:hidden; }
.mobile-controls { padding:9px 11px; background:var(--bg-panel); border-bottom:1px solid rgba(0,255,255,0.1); display: flex; flex-direction: column; gap: 8px;}
.channel-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; padding:9px; overflow-y:auto; flex:1; scrollbar-width:thin; scrollbar-color:rgba(0,255,255,0.3) transparent; }
@media(min-width:769px) { .channel-grid { grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); } }
.channel-card { background:var(--bg-card); border-radius:11px; padding:7px; height:95px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s; border:1px solid rgba(255,255,255,0.05); gap:4px; position: relative; }
.channel-card:hover { transform:scale(1.05); box-shadow:0 0 14px rgba(255,0,255,0.3); }
.channel-card.active { box-shadow:0 0 18px rgba(0,255,136,0.4); border-color:var(--neon-green); }
.channel-card img, .channel-card .no-logo { max-width:100%; max-height:48px; object-fit:contain; }
.channel-card .card-name { font-size:9px; color:#aaa; text-align:center; line-height:1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
.channel-card.active .card-name { color:var(--neon-green); }
.mobile-fav { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.6); border: none; font-size: 16px; cursor: pointer; color: white; z-index: 2; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.mobile-fav.is-fav { color: var(--neon-pink); background: rgba(255,0,255,0.2); }
.footer { text-align:center; padding:9px; border-top:2px solid rgba(255,0,68,0.25); font-size:13px; color:#555; background:var(--bg-panel); flex-shrink:0; }
.footer span { color:var(--neon-cyan); }
@media(max-width:768px) { .sidebar { display:none; } .app-wrapper { flex-direction:column; height:auto; min-height:calc(100vh - 58px); } .main-content { overflow:visible; } .kbd-hint { display:none; } .transport { padding:8px 10px; gap:8px; } .t-btn { width:42px; height:42px; font-size:16px; } .t-btn.play-btn { width:48px; height:48px; font-size:20px; } }
.no-logo { background: linear-gradient(135deg, #1a1a2e, #16213e); color: var(--neon-cyan); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; font-family: 'Orbitron', sans-serif; border-radius: 7px; }
.channel-card .no-logo { font-size: 24px; width: 100%; height: 48px; }
</style>
</head>
<body>
<div class="header">
  <h1>⚡ Developed by Biplab</h1>
  <button class="live-match-btn" onclick="goToLiveMatch()">🔴 LIVE MATCH</button>
</div>
<div class="app-wrapper">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-controls">
      <select id="sideGroup" class="search-group" onchange="applyFilters()"><option value="all">All Categories</option></select>
      <input type="text" id="sideSearch" class="search-group" placeholder="🔍 সার্চ করুন..." oninput="applyFilters()">
    </div>
    <div class="sidebar-list" id="sidebarList"></div>
  </aside>
  <div class="main-content">
    <div class="player-wrap">
      <video id="video" autoplay controls playsinline></video>
      <div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div><div class="skip-text" id="skipText">Loading...</div></div>
    </div>
    <div class="now-playing">
      <div><div class="np-label">NOW PLAYING</div><div class="np-name" id="nowPlayingName">—</div></div>
      <div class="kbd-hint">← → Arrow keys | Space = Play/Pause</div>
    </div>
    <div class="transport">
      <button class="t-btn" onclick="prevChannel()" title="Previous">⏮</button>
      <button class="t-btn play-btn" onclick="togglePlay()" title="Play/Pause">⏯</button>
      <button class="t-btn" onclick="nextChannel()" title="Next">⏭</button>
      <button class="t-btn pip-btn" onclick="togglePiP()" title="Picture-in-Picture">🖼️</button>
    </div>
    <div class="mobile-section">
      <div class="mobile-controls">
        <select id="mobileGroup" class="search-group" onchange="applyFilters()"><option value="all">All Categories</option></select>
        <input type="text" id="mobileSearch" class="search-group" placeholder="🔍 সার্চ করুন..." oninput="applyFilters()">
      </div>
      <div class="channel-grid" id="channelGrid"></div>
    </div>
    <div class="footer">© 2026 Media Player | <span>Developed by Biplab</span></div>
  </div>
</div>

  function parseList(text) {
    var lines = text.split('\n');
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].indexOf('#EXTINF') === 0) {
        var name = lines[i].split(',').pop().trim();
        var url  = (lines[i+1] || '').trim();
        var logo = '', group = 'Uncategorized';
        var m = lines[i].match(/tvg-logo="([^"]+)"/);
        if (m) logo = m[1];
        var g = lines[i].match(/group-title="([^"]+)"/);
        if (g) group = g[1];
        if (url && url.length > 5) channels.push({ name: name, url: url, logo: logo, group: group });
      }
    }
  }

  // লোকাল ফাইল থেকে সরাসরি চ্যানেল লোড করা হচ্ছে
  parseList(hardcodedM3U);
  initializeApp();

  // অনলাইন আপডেটের জন্য গিটহাব লিংক (যদি কাজ করে)
  var sources = ["https://raw.githubusercontent.com/biplabnt64-cyber/iptv-/main/biplab.m3u"];
  sources.forEach(function(url) {
    fetch(url).then(function(r) { return r.text(); }).then(function(txt) { parseList(txt); populateGroups(); }).catch(function() {});
  });

  function initializeApp() { populateGroups(); applyFilters(); if (channels.length) play(0); }

  function populateGroups() {
    var groups = [];
    channels.forEach(function(c) { if (groups.indexOf(c.group) === -1) groups.push(c.group); });
    groups.sort();
    var html = '<option value="all">All Categories</option><option value="fav">❤️ Favorites</option><option value="recent">🕒 Recently Watched</option>';
    groups.forEach(function(g) { html += '<option value="'+g+'">'+g+'</option>'; });
    document.getElementById('sideGroup').innerHTML = html;
    document.getElementById('mobileGroup').innerHTML = html;
  }

  window.applyFilters = function() {
    var sideQ = document.getElementById('sideSearch').value.toLowerCase();
    var mobQ = document.getElementById('mobileSearch').value.toLowerCase();
    var sideGrp = document.getElementById('sideGroup').value;
    var mobGrp = document.getElementById('mobileGroup').value;
    buildSidebar(sideGrp, sideQ);
    buildGrid(mobGrp, mobQ);
  }

  window.goToLiveMatch = function() {
    var sideGroup = document.getElementById('sideGroup');
    var mobileGroup = document.getElementById('mobileGroup');
    var liveOptionExists = false;
    for(var i=0; i<sideGroup.options.length; i++) { if(sideGroup.options[i].value === "Live Match") { liveOptionExists = true; break; } }
    if(liveOptionExists) {
        sideGroup.value = "Live Match"; mobileGroup.value = "Live Match"; applyFilters();
        var liveChannels = getFilteredList("Live Match", "");
        if(liveChannels.length > 0) play(channels.indexOf(liveChannels[0]));
    } else { alert("Live Match category is loading or not available yet."); }
  };

  function getFilteredList(group, query) {
    var list = channels;
    if (group === 'fav') list = channels.filter(function(c, i) { return favorites.indexOf(i) !== -1; });
    else if (group === 'recent') list = recent.map(function(r) { return channels[r]; }).filter(Boolean);
    else if (group !== 'all') list = channels.filter(function(c) { return c.group === group; });
    if (query) list = list.filter(function(c) { return c.name.toLowerCase().indexOf(query) !== -1; });
    return list;
  }
  
  window.imgError = function(el, name) {
    var placeholder = document.createElement('div'); placeholder.className = 'no-logo';
    placeholder.textContent = name.charAt(0).toUpperCase(); el.parentNode.replaceChild(placeholder, el);
  };

  function buildSidebar(group, query) {
    var container = document.getElementById('sidebarList'); container.innerHTML = '';
    var filtered = getFilteredList(group, query);
    if(filtered.length === 0) { container.innerHTML = '<div style="text-align:center;padding:20px;color:#555;">Not found</div>'; return; }
    filtered.forEach(function(ch) {
      var idx = channels.indexOf(ch); var isFav = favorites.indexOf(idx) !== -1; var el = document.createElement('div');
      el.className = 'sidebar-channel' + (idx === current ? ' active' : '');
      var logoHtml = ch.logo ? '<img src="'+ch.logo+'" alt="'+ch.name+'" onerror="imgError(this, \''+ch.name.replace(/'/g, "\\'")+'\')">' : '<div class="no-logo">'+ch.name.charAt(0).toUpperCase()+'</div>';
      el.innerHTML = logoHtml + '<div class="ch-name">'+ch.name+'</div><button class="fav-btn '+(isFav ? 'is-fav' : '')+'" onclick="event.stopPropagation(); window.toggleFav('+idx+')">'+(isFav ? '❤️' : '🤍')+'</button>';
      el.onclick = function() { play(idx); }; container.appendChild(el);
    });
  }

  function buildGrid(group, query) {
    var grid = document.getElementById('channelGrid'); grid.innerHTML = '';
    var filtered = getFilteredList(group, query);
    if(filtered.length === 0) { grid.innerHTML = '<div style="text-align:center;padding:20px;color:#555;grid-column:1/-1;">Not found</div>'; return; }
    filtered.forEach(function(ch) {
      var idx = channels.indexOf(ch); var isFav = favorites.indexOf(idx) !== -1; var el = document.createElement('div');
      el.className = 'channel-card' + (idx === current ? ' active' : '');
      var logoHtml = ch.logo ? '<img src="'+ch.logo+'" alt="'+ch.name+'" onerror="imgError(this, \''+ch.name.replace(/'/g, "\\'")+'\')">' : '<div class="no-logo">'+ch.name.charAt(0).toUpperCase()+'</div>';
      el.innerHTML = '<button class="mobile-fav '+(isFav ? 'is-fav' : '')+'" onclick="event.stopPropagation(); window.toggleFav('+idx+')">'+(isFav ? '❤️' : '🤍')+'</button>' + logoHtml + '<div class="card-name">'+ch.name+'</div>';
      el.onclick = function() { play(idx); }; grid.appendChild(el);
    });
  }

  function play(idx) {
    if (channels.length === 0) return; if (idx < 0 || idx >= channels.length) idx = 0;
    if (skipOrigin === -1) skipOrigin = idx; else if (idx === skipOrigin) { clearTimeout(autoSkipTimer); document.getElementById('loadingOverlay').classList.remove('show'); document.getElementById('nowPlayingName').textContent = "❌ All failed"; return; }
    current = idx; var ch  = channels[idx]; document.getElementById('nowPlayingName').textContent = ch.name;
    var loading = document.getElementById('loadingOverlay'); var skipText = document.getElementById('skipText'); loading.classList.add('show'); skipText.textContent = "Loading...";
    clearTimeout(autoSkipTimer); autoSkipTimer = setTimeout(function() { skipText.textContent = "⚠️ Skipping..."; nextChannel(); }, 20000);
    vid.oncanplay = function() { clearTimeout(autoSkipTimer); skipOrigin = -1; loading.classList.remove('show'); };
    vid.onerror = function() { clearTimeout(autoSkipTimer); skipText.textContent = "⚠️ Error..."; setTimeout(nextChannel, 1500); };
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    if (Hls.isSupported()) { hlsInstance = new Hls({ enableWorker:true, lowLatencyMode:true }); hlsInstance.loadSource(ch.url); hlsInstance.attachMedia(vid); hlsInstance.on(Hls.Events.ERROR, function(e, d) { if (d.fatal) { clearTimeout(autoSkipTimer); setTimeout(nextChannel, 1500); } }); }
    else if (vid.canPlayType('application/vnd.apple.mpegurl')) { vid.src = ch.url; } else { vid.src = ch.url; }
    vid.play().catch(function(){});
    if ('mediaSession' in navigator) { navigator.mediaSession.metadata = new MediaMetadata({ title: ch.name, artist: 'Media Player', artwork: ch.logo ? [{ src: ch.logo, sizes: '512x512', type: 'image/png' }] : [] }); }
    recent = recent.filter(function(r) { return r !== idx; }); recent.unshift(idx); if(recent.length > 15) recent.pop(); safeSet('iptv_rec', recent); applyFilters(); 
  }

  window.toggleFav = function(idx) { 
    if (favorites.indexOf(idx) !== -1) favorites = favorites.filter(function(i) { return i !== idx; }); else favorites.push(idx); 
    safeSet('iptv_fav', favorites); applyFilters(); 
  }
  
  window.nextChannel = function() { play((current + 1) % channels.length); };
  window.prevChannel = function() { play((current - 1 + channels.length) % channels.length); };
  window.togglePlay  = function() { if (vid.paused) vid.play(); else vid.pause(); };
  window.togglePiP = function() { try { if (document.pictureInPictureElement) document.exitPictureInPicture(); else if (vid.requestPictureInPicture) vid.requestPictureInPicture(); } catch (err) {} };

  function handleRemote(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    var code = e.keyCode || e.which; var isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement);
    if (isFullscreen) { if (code === 38 || code === 39 || e.key === 'ArrowUp' || e.key === 'ArrowRight') { e.preventDefault(); nextChannel(); } else if (code === 40 || code === 37 || e.key === 'ArrowDown' || e.key === 'ArrowLeft') { e.preventDefault(); prevChannel(); } }
    else { if (code === 39 || e.key === 'ArrowRight') nextChannel(); if (code === 37 || e.key === 'ArrowLeft') prevChannel(); }
    if (code === 32 || e.key === ' ') { e.preventDefault(); togglePlay(); }
  }
  window.addEventListener('keydown', handleRemote); window.addEventListener('keyup', handleRemote);
  if ('mediaSession' in navigator) { navigator.mediaSession.setActionHandler('previoustrack', function() { prevChannel(); }); navigator.mediaSession.setActionHandler('nexttrack', function() { nextChannel(); }); }
}
